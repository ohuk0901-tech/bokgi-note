    <rect class="screen-notion" x="10" y="10" width="320" height="620" rx="24"/>
    <text x="28" y="40" class="notion-fg mono label">9:41</text>
    <text x="28" y="88" class="notion-fg brand">복기노트</text>
    <text x="28" y="109" class="notion-muted label">6.23 화</text>
    <circle cx="296" cy="86" r="19" class="notion-card"/>
    <path d="M286 82h20M286 86h20M286 90h20" stroke="var(--notion-fg)" stroke-width="1.6" stroke-linecap="round"/>

    <rect x="28" y="132" width="284" height="154" rx="10" class="notion-surface"/>
    <text x="44" y="158" class="notion-muted label">오늘</text>
    <text x="44" y="198" class="notion-fg" font-size="29" font-weight="760">투자 일기</text>
    <text x="44" y="242" class="notion-fg mono date-big">06.23</text>
    <rect x="44" y="254" width="252" height="42" rx="8" class="notion-accent"/>
    <text x="170" y="281" text-anchor="middle" class="notion-on button">투자 일기 작성하기</text>

    <rect x="28" y="302" width="284" height="70" rx="10" class="notion-card"/>
    <text x="44" y="331" class="notion-fg section">이번 주 복기</text>
    <text x="44" y="351" class="notion-muted label">기록 4개</text>
