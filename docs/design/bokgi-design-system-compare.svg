    <text x="44" y="416" class="notion-fg section">복기 대기</text>
    <line x1="44" y1="431" x2="296" y2="431" class="notion-line"/>
    <text x="44" y="459" class="notion-muted mono label">6.19</text>
    <text x="88" y="456" class="notion-fg row-title">하락장 메모</text>
    <text x="282" y="459" class="notion-muted" font-size="18">›</text>
    <line x1="44" y1="475" x2="296" y2="475" class="notion-line"/>
    <text x="44" y="489" class="notion-muted mono label">6.17</text>
    <text x="88" y="489" class="notion-fg row-title">매수 보류</text>

    <rect x="28" y="508" width="284" height="82" rx="10" class="notion-card"/>
