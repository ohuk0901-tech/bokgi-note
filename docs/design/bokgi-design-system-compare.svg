<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">복기노트 디자인 시스템 후보 비교</title>
  <desc id="desc">Open Design Apple Notes형, shadcn neutral형, Notion workspace형 세 가지 모바일 대시보드 후보를 나란히 비교한 이미지</desc>
  <style>
    :root {
      --page-bg: #f5f5f7;
      --page-surface: #ffffff;
      --page-fg: #1d1d1f;
      --page-muted: #6e6e73;
      --page-border: #d2d2d7;

      --apple-bg: #ffffff;
      --apple-surface: #f5f5f7;
      --apple-card: #fbfbfd;
      --apple-fg: #1d1d1f;
      --apple-muted: #6e6e73;
      --apple-border: #e8e8ed;
      --apple-accent: #0071e3;
      --apple-on: #ffffff;

      --neutral-bg: #fafafa;
      --neutral-surface: #ffffff;
      --neutral-card: #ffffff;
      --neutral-fg: #171717;
      --neutral-muted: #737373;
      --neutral-border: #e5e5e5;
      --neutral-accent: #171717;
      --neutral-on: #ffffff;

      --notion-bg: #fbfbfa;
      --notion-surface: #ffffff;
      --notion-card: #f7f6f3;
      --notion-fg: #2f3437;
      --notion-muted: #787774;
      --notion-border: #e9e5de;
      --notion-accent: #0f766e;
      --notion-on: #ffffff;
    }

    text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0;
    }

    .mono {
      font-family: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    .page-bg { fill: var(--page-bg); }
    .note { fill: var(--page-surface); stroke: var(--page-border); stroke-width: 1; }
    .page-fg { fill: var(--page-fg); }
    .page-muted { fill: var(--page-muted); }

    .phone-shell { fill: var(--page-surface); stroke: var(--page-border); stroke-width: 1; }
    .screen-apple { fill: var(--apple-bg); }
    .screen-neutral { fill: var(--neutral-bg); }
    .screen-notion { fill: var(--notion-bg); }

    .apple-card { fill: var(--apple-card); stroke: var(--apple-border); stroke-width: 1; }
    .apple-surface { fill: var(--apple-surface); stroke: var(--apple-border); stroke-width: 1; }
    .apple-fg { fill: var(--apple-fg); }
    .apple-muted { fill: var(--apple-muted); }
    .apple-accent { fill: var(--apple-accent); }
    .apple-on { fill: var(--apple-on); }
    .apple-line { stroke: var(--apple-border); stroke-width: 1; }

    .neutral-card { fill: var(--neutral-card); stroke: var(--neutral-border); stroke-width: 1; }
    .neutral-surface { fill: var(--neutral-surface); stroke: var(--neutral-border); stroke-width: 1; }
    .neutral-fg { fill: var(--neutral-fg); }
    .neutral-muted { fill: var(--neutral-muted); }
    .neutral-accent { fill: var(--neutral-accent); }
    .neutral-on { fill: var(--neutral-on); }
    .neutral-line { stroke: var(--neutral-border); stroke-width: 1; }

    .notion-card { fill: var(--notion-card); stroke: var(--notion-border); stroke-width: 1; }
    .notion-surface { fill: var(--notion-surface); stroke: var(--notion-border); stroke-width: 1; }
    .notion-fg { fill: var(--notion-fg); }
    .notion-muted { fill: var(--notion-muted); }
    .notion-accent { fill: var(--notion-accent); }
    .notion-on { fill: var(--notion-on); }
    .notion-line { stroke: var(--notion-border); stroke-width: 1; }

    .h1 { font-size: 32px; font-weight: 760; }
    .card-title { font-size: 18px; font-weight: 760; }
    .note-text { font-size: 13px; }
    .brand { font-size: 24px; font-weight: 760; }
    .section { font-size: 16px; font-weight: 760; }
    .label { font-size: 12px; }
    .date-big { font-size: 39px; font-weight: 520; }
    .row-title { font-size: 14px; font-weight: 700; }
    .button { font-size: 15px; font-weight: 760; }
