    <text x="270" y="342" text-anchor="middle" class="neutral-fg button">시작</text>

    <rect x="28" y="386" width="284" height="108" rx="12" class="neutral-card"/>
    <text x="44" y="416" class="neutral-fg section">복기 대기</text>
    <line x1="44" y1="431" x2="296" y2="431" class="neutral-line"/>
    <text x="44" y="459" class="neutral-muted mono label">6.19</text>
    <text x="88" y="456" class="neutral-fg row-title">하락장 메모</text>
    <text x="282" y="459" class="neutral-muted" font-size="18">›</text>
    <line x1="44" y1="475" x2="296" y2="475" class="neutral-line"/>
    <text x="44" y="489" class="neutral-muted mono label">6.17</text>
    <text x="88" y="489" class="neutral-fg row-title">매수 보류</text>

    <rect x="28" y="508" width="284" height="82" rx="12" class="neutral-card"/>
    <text x="44" y="538" class="neutral-fg section">대표 메모</text>
    <text x="44" y="566" class="neutral-fg row-title">급등장 매수 기준</text>
    <text x="44" y="588" class="neutral-fg row-title">손절 전 확인할 것</text>
  </g>

