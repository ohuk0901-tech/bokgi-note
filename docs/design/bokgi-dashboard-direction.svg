<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">복기노트 모바일 대시보드 방향 시안</title>
  <desc id="desc">투자 일기 작성, 이번 주 복기, 복기 대기, 대표 메모, 최근 기록만 앞에 두고 관리 기능은 숨긴 모바일 홈 화면</desc>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f5f5f7;
      --surface-warm: #fbfbfd;
      --fg: #1d1d1f;
      --fg-2: #424245;
      --muted: #6e6e73;
      --meta: #86868b;
      --border: #d2d2d7;
      --border-soft: #e8e8ed;
      --accent: #0071e3;
      --accent-on: #ffffff;
    }

    .bg { fill: var(--bg); }
    .surface { fill: var(--surface-warm); stroke: var(--border-soft); stroke-width: 1; }
    .surface-strong { fill: var(--bg); stroke: var(--border); stroke-width: 1; }
    .ink { fill: var(--fg); }
    .muted { fill: var(--muted); }
    .meta { fill: var(--meta); }
    .accent { fill: var(--accent); }
    .accent-on { fill: var(--accent-on); }
    .line { stroke: var(--border-soft); stroke-width: 1; }
    text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0;
    }
    .display {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
    }
    .mono {
      font-family: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }
    .h1 { font-size: 25px; font-weight: 700; }
    .h2 { font-size: 17px; font-weight: 700; }
    .body { font-size: 14px; font-weight: 650; }
    .small { font-size: 12px; }
    .button { font-size: 16px; font-weight: 700; }
  </style>

  <rect class="bg" width="390" height="844" rx="0" />

  <text x="18" y="24" class="ink mono small">9:41</text>
  <g class="meta" transform="translate(334 15)">
    <rect x="0" y="7" width="2" height="4" rx="1"/>
    <rect x="4" y="5" width="2" height="6" rx="1"/>
    <rect x="8" y="3" width="2" height="8" rx="1"/>
    <rect x="12" y="1" width="2" height="10" rx="1"/>
    <rect x="22" y="3" width="20" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="24" y="5" width="14" height="5" rx="1"/>
    <path d="M44 6.5v2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <text x="18" y="70" class="ink display h1">복기노트</text>
  <text x="18" y="91" class="muted small">6.23 화</text>
  <g transform="translate(340 52)" class="ink">
    <circle cx="19" cy="19" r="19" fill="var(--surface)"/>
    <path d="M10 15h18M10 19h18M10 23h18" stroke="var(--fg-2)" stroke-width="1.7" stroke-linecap="round"/>
  </g>

  <rect x="18" y="112" width="354" height="82" rx="18" class="surface-strong"/>
  <rect x="35" y="126" width="320" height="54" rx="12" class="ink"/>
  <text x="195" y="160" text-anchor="middle" class="accent-on button">투자 일기 작성하기</text>

  <rect x="18" y="204" width="354" height="78" rx="18" class="surface"/>
  <text x="35" y="234" class="ink display h2">이번 주 복기</text>
  <text x="35" y="255" class="muted small">기록 4개</text>
  <rect x="282" y="220" width="73" height="46" rx="12" class="accent"/>
  <text x="318.5" y="250" text-anchor="middle" class="accent-on button">시작</text>

  <rect x="18" y="292" width="354" height="180" rx="18" class="surface"/>
  <text x="35" y="323" class="ink display h2">복기 대기</text>
  <line x1="35" y1="337" x2="355" y2="337" class="line"/>
  <rect x="35" y="348" width="42" height="24" rx="12" class="bg" stroke="var(--border-soft)"/>
  <text x="56" y="364" text-anchor="middle" class="muted small" font-weight="700">1주</text>
  <text x="91" y="364" class="ink body">하락장 메모</text>
  <text x="337" y="368" text-anchor="end" class="meta" font-size="18">›</text>
  <line x1="35" y1="392" x2="355" y2="392" class="line"/>
  <rect x="35" y="403" width="54" height="24" rx="12" class="bg" stroke="var(--border-soft)"/>
  <text x="62" y="419" text-anchor="middle" class="muted small" font-weight="700">3개월</text>
  <text x="103" y="419" class="ink body">매수 보류</text>
  <text x="337" y="423" text-anchor="end" class="meta" font-size="18">›</text>
  <line x1="35" y1="447" x2="355" y2="447" class="line"/>
  <rect x="35" y="458" width="42" height="24" rx="12" class="bg" stroke="var(--border-soft)"/>
  <text x="56" y="474" text-anchor="middle" class="muted small" font-weight="700">1년</text>
  <text x="91" y="474" class="ink body">첫 원칙 메모</text>
  <text x="337" y="478" text-anchor="end" class="meta" font-size="18">›</text>

  <rect x="18" y="482" width="354" height="104" rx="18" class="surface"/>
  <text x="35" y="513" class="ink display h2">대표 메모</text>
  <text x="337" y="513" text-anchor="end" class="muted small" font-weight="700">전체</text>
  <line x1="35" y1="528" x2="355" y2="528" class="line"/>
  <text x="35" y="550" class="ink body">급등장 매수 기준</text>
  <text x="337" y="554" text-anchor="end" class="meta" font-size="18">›</text>
  <line x1="35" y1="561" x2="355" y2="561" class="line"/>
  <text x="35" y="580" class="ink body">손절 전 확인할 것</text>
  <text x="337" y="584" text-anchor="end" class="meta" font-size="18">›</text>

  <rect x="18" y="596" width="354" height="150" rx="18" class="surface"/>
  <text x="35" y="627" class="ink display h2">최근 기록</text>
  <text x="337" y="627" text-anchor="end" class="muted small" font-weight="700">전체</text>
  <line x1="35" y1="642" x2="355" y2="642" class="line"/>
  <text x="35" y="673" class="meta mono small">6.22</text>
  <text x="82" y="668" class="ink body">관망</text>
  <text x="337" y="673" text-anchor="end" class="meta" font-size="18">›</text>
  <line x1="35" y1="699" x2="355" y2="699" class="line"/>
  <text x="35" y="730" class="meta mono small">6.21</text>
  <text x="82" y="725" class="ink body">환율 뉴스</text>
  <text x="337" y="730" text-anchor="end" class="meta" font-size="18">›</text>
</svg>
