<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>복기노트 대시보드 방향 시안</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f5f5f7;
      --surface-warm: #fbfbfd;
      --fg: #1d1d1f;
      --fg-2: #424245;
      --muted: #6e6e73;
      --meta: #86868b;
      --border: #d2d2d7;
      --border-soft: #e8e8ed;
      --accent: #0071e3;
      --accent-on: #ffffff;
      --accent-hover: #0077ed;
      --accent-active: #0066cc;
      --success: #16a34a;
      --warn:    #eab308;
      --danger:  #dc2626;
      --font-display:
        "SF Pro Display", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-body:
        "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono:
        "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
      --text-xs:   12px;
      --text-sm:   14px;
      --text-base: 17px;
      --text-lg:   21px;
      --text-xl:   28px;
      --text-2xl:  40px;
      --text-3xl:  56px;
      --text-4xl:  80px;
      --leading-body:  1.47;
      --leading-tight: 1.05;
      --tracking-display: -0.015em;
      --space-1:  4px;
      --space-2:  8px;
      --space-3:  12px;
      --space-4:  16px;
      --space-5:  20px;
      --space-6:  24px;
      --space-8:  32px;
      --space-12: 48px;
      --section-y-desktop: 100px;
      --section-y-tablet:  64px;
      --section-y-phone:   40px;
      --radius-sm:   8px;
      --radius-md:   12px;
      --radius-lg:   18px;
      --radius-pill: 980px;
      --elev-flat:   none;
      --elev-ring:   0 0 0 1px var(--border);
      --elev-raised: 0 12px 32px rgba(0, 0, 0, 0.08);
      --focus-ring: 0 0 0 4px color-mix(in oklab, var(--accent), transparent 65%);
      --motion-fast:   150ms;
      --motion-base:   220ms;
      --ease-standard: cubic-bezier(0.28, 0, 0.22, 1);
      --container-max:            1024px;
      --container-gutter-desktop: 22px;
      --container-gutter-tablet:  18px;
      --container-gutter-phone:   16px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      background: var(--surface);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--surface);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-body);
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      border: 0;
      padding: 0;
      background: none;
      color: inherit;
      font: inherit;
      letter-spacing: 0;
      cursor: pointer;
    }

    h1, h2, h3, p, blockquote { margin: 0; }
    h1, h2, h3 {
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: 0;
    }

    svg { display: block; }

    .stage {
      min-height: 100dvh;
      display: grid;
      place-items: start center;
      padding: 0;
    }

    .screen {
      position: relative;
      width: min(100%, 430px);
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bg);
    }

    .safe {
      padding: 14px var(--container-gutter-phone) 28px;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 26px;
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--fg-2);
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: var(--space-4);
      padding: 15px 0 18px;
    }

    .title h1 {
      font-size: 25px;
      line-height: 1.08;
    }

    .title p {
      margin-top: 2px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.25;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--fg-2);
      transition: background var(--motion-fast) var(--ease-standard);
    }

    .icon-button:hover,
    .icon-button:focus-visible {
      outline: none;
      background: var(--surface);
    }

    .icon-button:focus-visible { box-shadow: var(--focus-ring); }

    main {
      display: grid;
      gap: 10px;
    }

    .panel {
      background: var(--surface-warm);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
    }

    .action-card {
      padding: 14px;
      background: var(--bg);
      box-shadow: var(--elev-ring);
    }

    .section-card {
      padding: 14px;
    }

    .card-head,
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .state {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .primary-button,
    .secondary-button,
    .quiet-button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      font-weight: 600;
      transition:
        transform var(--motion-fast) var(--ease-standard),
        background var(--motion-fast) var(--ease-standard),
        border-color var(--motion-fast) var(--ease-standard);
    }

    .primary-button {
      width: 100%;
      min-height: 54px;
      background: var(--fg);
      color: var(--bg);
      font-size: 17px;
    }

    .secondary-button {
      min-width: 76px;
      padding: 0 17px;
      background: var(--accent);
      color: var(--accent-on);
    }

    .quiet-button {
      min-height: 36px;
      padding: 0 12px;
      background: var(--bg);
      border: 1px solid var(--border-soft);
      color: var(--fg);
      font-size: 13px;
    }

    .text-button {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .primary-button:hover { background: var(--fg-2); }
    .secondary-button:hover { background: var(--accent-hover); }
    .quiet-button:hover { border-color: var(--border); }
    .primary-button:active,
    .secondary-button:active,
    .quiet-button:active {
      transform: translateY(1px);
    }
    .primary-button:focus-visible,
    .secondary-button:focus-visible,
    .quiet-button:focus-visible,
    .text-button:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    .review-card {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: var(--space-4);
      min-height: 78px;
      padding: 14px;
    }

    .review-card h2,
    .section-card h2 {
      font-size: 17px;
      line-height: 1.25;
    }

    .meta {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .pending-list,
    .record-list {
      margin-top: 9px;
      display: grid;
    }

    .pending-row,
    .record-row {
      display: grid;
      grid-template-columns: 46px 1fr auto;
      align-items: center;
      gap: var(--space-3);
      min-height: 52px;
      border-top: 1px solid var(--border-soft);
      text-align: left;
    }

    .pending-row:first-child,
    .record-row:first-child {
      border-top: 0;
    }

    .date {
      color: var(--meta);
      font-family: var(--font-mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .review-label {
      width: fit-content;
      min-width: 42px;
      padding: 4px 8px;
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
    }

    .row-title {
      color: var(--fg);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.25;
    }

    .row-sub {
      margin-top: 1px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .pin-list {
      margin-top: 9px;
      display: grid;
    }

    .pin-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: var(--space-3);
      min-height: 48px;
      border-top: 1px solid var(--border-soft);
      text-align: left;
    }

    .pin-row:first-child {
      border-top: 0;
    }

    .chevron {
      color: var(--meta);
      font-size: 18px;
      line-height: 1;
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: color-mix(in oklab, var(--fg), transparent 78%);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--motion-base) var(--ease-standard);
    }

    .sheet {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 21;
      width: min(100%, 430px);
      padding: 10px var(--container-gutter-phone) 22px;
      transform: translate(-50%, 105%);
      background: var(--bg);
      border: 1px solid var(--border-soft);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -16px 42px color-mix(in oklab, var(--fg), transparent 88%);
      transition: transform var(--motion-base) var(--ease-standard);
    }

    .sheet.open {
      transform: translate(-50%, 0);
    }

    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet-handle {
      width: 42px;
      height: 4px;
      margin: 0 auto 16px;
      border-radius: var(--radius-pill);
      background: var(--border);
    }

    .sheet h2 {
      margin-bottom: 12px;
      font-size: 19px;
      line-height: 1.2;
    }

    .sheet-actions {
      display: grid;
      gap: var(--space-2);
    }

    .sheet-action {
      width: 100%;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      background: var(--surface-warm);
      font-weight: 600;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 30;
      width: min(calc(100% - 32px), 360px);
      padding: 12px 14px;
      transform: translate(-50%, 14px);
      border-radius: var(--radius-md);
      background: var(--fg);
      color: var(--bg);
      opacity: 0;
      pointer-events: none;
      text-align: center;
      font-size: 14px;
      transition:
        opacity var(--motion-fast) var(--ease-standard),
        transform var(--motion-fast) var(--ease-standard);
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    @media (min-width: 760px) {
      .stage {
        padding: 32px 0;
        place-items: center;
      }

      .screen {
        width: 390px;
        min-height: 844px;
        border: 1px solid var(--border);
        border-radius: 34px;
        box-shadow: 0 28px 80px color-mix(in oklab, var(--fg), transparent 88%);
      }
    }

    @media (max-width: 370px) {
      .safe { padding-inline: 14px; }
      .review-card { grid-template-columns: 1fr; }
      .secondary-button { width: 100%; }
      .pending-row,
      .record-row {
        grid-template-columns: 46px 1fr auto;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="screen">
      <div class="safe">
        <div class="status" aria-hidden="true">
          <span>9:41</span>
          <div class="status-icons">
            <svg width="17" height="11" viewBox="0 0 17 11" fill="none">
              <rect x="1" y="6" width="2" height="4" rx="1" fill="currentColor"/>
              <rect x="5" y="4" width="2" height="6" rx="1" fill="currentColor"/>
              <rect x="9" y="2" width="2" height="8" rx="1" fill="currentColor"/>
              <rect x="13" y="0" width="2" height="10" rx="1" fill="currentColor"/>
            </svg>
            <svg width="24" height="12" viewBox="0 0 24 12" fill="none">
              <rect x="1" y="2" width="19" height="8" rx="2" stroke="currentColor" stroke-width="1.2"/>
              <rect x="3" y="4" width="14" height="4" rx="1" fill="currentColor"/>
              <path d="M21 4.5v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </div>
        </div>

        <header class="topbar">
          <div class="title">
            <h1>복기노트</h1>
            <p>6.23 화</p>
          </div>
          <button class="icon-button" type="button" data-open-sheet="menu" aria-label="관리 메뉴">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M5 12h14M5 7h14M5 17h14" stroke-linecap="round"/>
            </svg>
          </button>
        </header>

        <main>
          <section class="panel action-card" data-od-id="today">
            <button class="primary-button" type="button" id="todayButton">투자 일기 작성하기</button>
          </section>

          <section class="panel review-card" data-od-id="weekly-review">
            <div>
              <h2>이번 주 복기</h2>
              <p class="meta">기록 4개</p>
            </div>
            <button class="secondary-button" type="button" data-toast="이번 주 복기를 시작했어요.">시작</button>
          </section>

          <section class="panel section-card" data-od-id="pending-review">
            <div class="row">
              <h2>복기 대기</h2>
            </div>
            <div class="pending-list">
              <button class="pending-row" type="button" data-toast="하락장 메모를 열었어요.">
                <span class="review-label">1주</span>
                <p class="row-title">하락장 메모</p>
                <span class="chevron" aria-hidden="true">›</span>
              </button>
              <button class="pending-row" type="button" data-toast="매수 보류를 열었어요.">
                <span class="review-label">3개월</span>
                <p class="row-title">매수 보류</p>
                <span class="chevron" aria-hidden="true">›</span>
              </button>
              <button class="pending-row" type="button" data-toast="첫 원칙 메모를 열었어요.">
                <span class="review-label">1년</span>
                <p class="row-title">첫 원칙 메모</p>
                <span class="chevron" aria-hidden="true">›</span>
              </button>
            </div>
          </section>

          <section class="panel section-card" data-od-id="principle">
            <div class="row">
              <h2>대표 메모</h2>
              <button class="text-button" type="button" data-toast="대표 메모를 열었어요.">전체</button>
            </div>
            <div class="pin-list">
              <button class="pin-row" type="button" data-toast="급등장 매수 기준을 열었어요.">
                <p class="row-title">급등장 매수 기준</p>
                <span class="chevron" aria-hidden="true">›</span>
              </button>
              <button class="pin-row" type="button" data-toast="손절 전 확인할 것을 열었어요.">
                <p class="row-title">손절 전 확인할 것</p>
                <span class="chevron" aria-hidden="true">›</span>
              </button>
            </div>
          </section>

          <section class="panel section-card" data-od-id="recent">
            <div class="row">
              <h2>최근 기록</h2>
              <button class="text-button" type="button" data-toast="전체 기록을 열었어요.">전체</button>
            </div>
            <div class="record-list">
              <button class="record-row" type="button" data-toast="관망 기록을 열었어요.">
                <span class="date">6.22</span>
                <p class="row-title">관망</p>
                <span class="chevron" aria-hidden="true">›</span>
              </button>
              <button class="record-row" type="button" data-toast="환율 뉴스 기록을 열었어요.">
                <span class="date">6.21</span>
                <p class="row-title">환율 뉴스</p>
                <span class="chevron" aria-hidden="true">›</span>
              </button>
            </div>
          </section>
        </main>
      </div>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <aside class="sheet" id="sheet" aria-label="빠른 작업" aria-live="polite">
    <div class="sheet-handle"></div>
    <h2 id="sheetTitle">빠른 작업</h2>
    <div class="sheet-actions" id="sheetActions"></div>
  </aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const sheet = document.getElementById("sheet");
    const sheetBackdrop = document.getElementById("sheetBackdrop");
    const sheetTitle = document.getElementById("sheetTitle");
    const sheetActions = document.getElementById("sheetActions");
    const toast = document.getElementById("toast");
    const todayButton = document.getElementById("todayButton");

    const sheetContent = {
      menu: {
        title: "관리",
        actions: ["폴더", "템플릿", "휴지통", "설정"]
      }
    };

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => {
        toast.classList.remove("show");
      }, 1400);
    }

    function closeSheet() {
      sheet.classList.remove("open");
      sheetBackdrop.classList.remove("open");
    }

    function openSheet(kind) {
      const content = sheetContent[kind] || sheetContent.menu;
      sheetTitle.textContent = content.title;
      sheetActions.textContent = "";
      content.actions.forEach((label) => {
        const button = document.createElement("button");
        const value = document.createElement("span");
        const arrow = document.createElement("span");
        button.className = "sheet-action";
        button.type = "button";
        value.textContent = label;
        arrow.textContent = "›";
        arrow.setAttribute("aria-hidden", "true");
        button.append(value, arrow);
        button.addEventListener("click", () => {
          closeSheet();
          showToast(`${label}을 열었어요.`);
        });
        sheetActions.appendChild(button);
      });
      sheet.classList.add("open");
      sheetBackdrop.classList.add("open");
    }

    document.querySelectorAll("[data-open-sheet]").forEach((button) => {
      button.addEventListener("click", () => openSheet(button.dataset.openSheet));
    });

    todayButton.addEventListener("click", () => {
      todayButton.textContent = "이어쓰기";
      showToast("투자 일기를 열었어요.");
    });

    document.querySelectorAll("[data-toast]").forEach((button) => {
      button.addEventListener("click", () => showToast(button.dataset.toast));
    });

    sheetBackdrop.addEventListener("click", closeSheet);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeSheet();
    });
  </script>
</body>
</html>
